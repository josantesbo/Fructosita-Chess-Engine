<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CMMA 2026 · Campeonato Mundial de Motores de Ajedrez — panel de seguimiento del torneo">
<title>CMMA 2026 · Campeonato Mundial de Motores de Ajedrez</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♟</text></svg>">
<style>
/* ── RESET & TOKENS ─────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg0:#05080f;--bg1:#09111f;--bg2:#0e1929;--bg3:#142035;--bg4:#1a2a44;--bg5:#213252;
  --ln:#1e3050;--ln2:#2a4570;--ln3:#365888;
  --cyan:#00d8f0;--cyan2:#009ab0;--cyan3:#005566;--cyan4:#002a35;
  --gold:#f0c030;--gold2:#b08820;--gold3:#3a2a00;
  --grn:#00d870;--grn2:#009848;--grn3:#003820;
  --ylw:#ffe840;--ylw2:#998000;--ylw3:#272000;
  --red:#ff4055;--red2:#991828;--red3:#280008;
  --t1:#deeef8;--t2:#7098b8;--t3:#385878;--t4:#1a3050;
  --fs:'Inter',system-ui,sans-serif;--fm:'JetBrains Mono','Fira Code',monospace;
}
html,body,#app{height:100%;overflow:hidden}
body{background:var(--bg0);color:var(--t1);font-family:var(--fs);font-size:14px;position:relative}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 15% 10%,rgba(0,216,240,.05),transparent 40%),
    radial-gradient(circle at 85% 85%,rgba(240,192,48,.04),transparent 40%),
    linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
  background-size:auto,auto,42px 42px,42px 42px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--ln3),var(--ln2));border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--cyan3)}
a{color:var(--cyan);text-decoration:none}
:focus-visible{outline:2px solid var(--cyan2);outline-offset:2px;border-radius:4px}
mark{background:rgba(0,216,240,.25);color:var(--cyan);border-radius:2px;padding:0 1px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ── LAYOUT ─────────────────────────────────────────────────────────────── */
#app{display:flex}
#sidebar{width:230px;min-width:230px;background:var(--bg1);border-right:1px solid var(--ln);
  display:flex;flex-direction:column;position:relative;z-index:100}
#sidebar::after{content:'';position:absolute;right:0;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,var(--cyan3) 40%,var(--cyan3) 60%,transparent)}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:50px;background:var(--bg1);border-bottom:1px solid var(--ln);
  display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;position:relative}
#topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan3),transparent)}
#content{flex:1;overflow-y:auto;overflow-x:hidden}
#menu-btn{display:none;width:36px;height:36px;align-items:center;justify-content:center;
  background:var(--bg2);border:1px solid var(--ln);border-radius:7px;color:var(--t2);
  cursor:pointer;font-size:16px;flex-shrink:0}
#menu-btn:hover{color:var(--cyan);border-color:var(--ln2)}
#backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90}
#backdrop.show{display:block}

/* ── SIDEBAR LOGO ───────────────────────────────────────────────────────── */
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid var(--ln)}
.sb-logo-eyebrow{font-family:var(--fm);font-size:10px;color:var(--t3);letter-spacing:3px;margin-bottom:4px}
.sb-logo-title{font-size:22px;font-weight:800;color:var(--cyan);letter-spacing:1px;line-height:1;text-shadow:0 0 18px rgba(0,216,240,.35)}
.sb-logo-sub{font-family:var(--fm);font-size:10px;color:var(--t3);letter-spacing:3px;margin-top:3px}
.sb-live{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11px;color:var(--t3);font-family:var(--fm)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--grn);
  box-shadow:0 0 8px var(--grn);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── NAV ────────────────────────────────────────────────────────────────── */
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-section{font-family:var(--fm);font-size:10px;color:var(--t4);letter-spacing:2px;
  padding:10px 10px 4px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;
  cursor:pointer;font-size:13px;font-weight:500;color:var(--t2);margin-bottom:1px;
  transition:all .15s;border:1px solid transparent;position:relative}
.nav-item:hover{background:var(--bg3);color:var(--t1);border-color:var(--ln)}
.nav-item.on{background:linear-gradient(135deg,var(--bg3),var(--bg4));
  color:var(--cyan);border-color:var(--ln2)}
.nav-item.on::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);
  width:3px;height:16px;background:var(--cyan);border-radius:0 2px 2px 0}
.nav-ico{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nav-count{margin-left:auto;font-family:var(--fm);font-size:10px;
  padding:1px 7px;border-radius:10px;background:var(--bg4);color:var(--t3)}
.nav-item.on .nav-count{background:var(--cyan4);color:var(--cyan)}
.sb-footer{padding:11px 16px;border-top:1px solid var(--ln);font-family:var(--fm);
  font-size:10px;color:var(--t4);line-height:1.6}

/* ── TOPBAR ─────────────────────────────────────────────────────────────── */
.tb-title{font-size:18px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-pill{padding:3px 10px;border-radius:20px;border:1px solid var(--ln2);
  background:var(--bg2);font-family:var(--fm);font-size:11px;color:var(--cyan);flex-shrink:0}
.tb-prov{padding:3px 10px;border-radius:20px;border:1px solid var(--ylw2);
  background:var(--ylw3);font-family:var(--fm);font-size:10px;color:var(--ylw)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}

/* ── SEARCH ─────────────────────────────────────────────────────────────── */
.gs-wrap{position:relative}
.gs-input{width:220px;background:var(--bg2);border:1px solid var(--ln);border-radius:7px;
  padding:6px 11px;color:var(--t1);font-family:var(--fs);font-size:13px;outline:none;transition:.15s}
.gs-input:focus{border-color:var(--cyan2)}
.gs-input::placeholder{color:var(--t3)}
.gs-drop{position:absolute;top:calc(100%+4px);right:0;width:320px;max-width:88vw;
  background:var(--bg0);border:1px solid var(--ln2);border-radius:8px;
  box-shadow:0 12px 40px rgba(0,0,0,.6);z-index:200;overflow:hidden}
.gs-item{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--ln);
  display:flex;align-items:center;justify-content:space-between;gap:8px;transition:.1s}
.gs-item:hover,.gs-item.active{background:var(--bg3)}
.gs-item:last-child{border:none}
.gs-item-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gs-item-meta{display:flex;gap:8px;align-items:center;flex-shrink:0}
.gs-hint{padding:6px 14px;font-family:var(--fm);font-size:9px;color:var(--t4);
  border-top:1px solid var(--ln);background:var(--bg1);letter-spacing:.5px}

/* ── PAGE ───────────────────────────────────────────────────────────────── */
.page{padding:22px 24px;animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pg-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.pg-title{font-size:26px;font-weight:800;color:var(--t1);letter-spacing:.3px}
.pg-sub{font-size:13px;color:var(--t3);margin-top:3px}
.pg-actions{display:flex;gap:8px;align-items:center}

/* ── KPI ROW ────────────────────────────────────────────────────────────── */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;margin-bottom:22px}
.kpi-row .kpi{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) backwards}
.kpi-row .kpi:nth-child(1){animation-delay:.02s}.kpi-row .kpi:nth-child(2){animation-delay:.06s}
.kpi-row .kpi:nth-child(3){animation-delay:.10s}.kpi-row .kpi:nth-child(4){animation-delay:.14s}
.kpi-row .kpi:nth-child(5){animation-delay:.18s}.kpi-row .kpi:nth-child(6){animation-delay:.22s}
.kpi{background:var(--bg2);border:1px solid var(--ln);border-radius:10px;
  padding:15px 17px;position:relative;overflow:hidden;
  transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .22s,box-shadow .22s}
.kpi:hover{border-color:var(--ln2);transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.35)}
.kpi-bar{position:absolute;top:0;left:0;right:0;height:2px}
.kpi-lbl{font-family:var(--fm);font-size:10px;color:var(--t3);letter-spacing:1.5px;
  text-transform:uppercase;margin-bottom:9px}
.kpi-num{font-size:36px;font-weight:800;line-height:1;letter-spacing:-1px;transition:color .2s}
.kpi-sub{font-size:12px;color:var(--t3);margin-top:4px}
.kpi-prog{height:3px;background:var(--bg4);border-radius:2px;margin-top:10px;overflow:hidden}
.kpi-prog-fill{height:100%;border-radius:2px;transition:width .5s ease}
.kpi.v-cyan .kpi-bar{background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
.kpi.v-cyan .kpi-num{color:var(--cyan)}
.kpi.v-cyan .kpi-prog-fill{background:linear-gradient(90deg,var(--cyan3),var(--cyan))}
.kpi.v-gold .kpi-bar{background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.kpi.v-gold .kpi-num{color:var(--gold)}
.kpi.v-gold .kpi-prog-fill{background:linear-gradient(90deg,var(--gold3),var(--gold))}
.kpi.v-grn .kpi-bar{background:linear-gradient(90deg,transparent,var(--grn),transparent)}
.kpi.v-grn .kpi-num{color:var(--grn)}
.kpi.v-grn .kpi-prog-fill{background:linear-gradient(90deg,var(--grn3),var(--grn))}
.kpi.v-ylw .kpi-bar{background:linear-gradient(90deg,transparent,var(--ylw),transparent)}
.kpi.v-ylw .kpi-num{color:var(--ylw)}
.kpi.v-ylw .kpi-prog-fill{background:linear-gradient(90deg,var(--ylw3),var(--ylw))}
.kpi.v-red .kpi-bar{background:linear-gradient(90deg,transparent,var(--red),transparent)}
.kpi.v-red .kpi-num{color:var(--red)}

/* ── CARDS ──────────────────────────────────────────────────────────────── */
.card{background:var(--bg2);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--ln);background:var(--bg3);gap:8px;flex-wrap:wrap}
.card-title{font-size:14px;font-weight:700;color:var(--t1)}
.card-body{padding:16px}

/* ── TABLE ──────────────────────────────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--bg3);color:var(--t3);font-family:var(--fm);font-size:10px;
  letter-spacing:1px;text-transform:uppercase;padding:9px 11px;text-align:left;
  border-bottom:1px solid var(--ln);white-space:nowrap;user-select:none}
.tbl th.sort{cursor:pointer}
.tbl th.sort:hover{color:var(--t2)}
.tbl td{padding:8px 11px;border-bottom:1px solid rgba(255,255,255,.025);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:rgba(255,255,255,.02)}
.tbl tbody tr.row-cl td{background:rgba(0,216,112,.035)}
.tbl tbody tr.row-rp td{background:rgba(255,232,64,.03)}
.tbl tbody tr.row-hl td{background:rgba(0,216,240,.07)!important}
.tbl-wrap{overflow-x:auto}

/* ── RANK BADGE ─────────────────────────────────────────────────────────── */
.rb{display:inline-flex;align-items:center;justify-content:center;
  width:25px;height:25px;border-radius:5px;font-family:var(--fm);
  font-size:11px;font-weight:700;flex-shrink:0}
.rb1{background:rgba(240,192,48,.12);color:var(--gold);border:1px solid var(--gold2)}
.rb2{background:rgba(112,152,184,.12);color:#90b0cc;border:1px solid #3a6080}
.rb3{background:rgba(200,110,60,.12);color:#d08060;border:1px solid #6a3820}
.rb7{background:rgba(255,232,64,.12);color:var(--ylw);border:1px solid var(--ylw2)}
.rbn{background:var(--bg3);color:var(--t3);border:1px solid var(--ln)}

/* ── STATUS BADGES ──────────────────────────────────────────────────────── */
.sb-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;
  border-radius:4px;font-family:var(--fm);font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.5px}
.sb-dot{width:5px;height:5px;border-radius:50%}
.sb-cl{background:var(--grn3);color:var(--grn);border:1px solid var(--grn2)}
.sb-cl .sb-dot{background:var(--grn);animation:pulse 2s infinite}
.sb-rp{background:var(--ylw3);color:var(--ylw);border:1px solid var(--ylw2)}
.sb-rp .sb-dot{background:var(--ylw)}
.sb-ej{background:var(--bg3);color:var(--t3);border:1px solid var(--ln)}
.sb-ej .sb-dot{background:var(--t3)}

/* ── ELO DIFF ───────────────────────────────────────────────────────────── */
.ep{color:var(--grn);font-family:var(--fm);font-size:12px}
.en{color:var(--red);font-family:var(--fm);font-size:12px}
.ez{color:var(--t3);font-family:var(--fm);font-size:12px}

/* ── TAGS ───────────────────────────────────────────────────────────────── */
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-family:var(--fm);font-size:10px}
.tag-n{background:var(--cyan4);border:1px solid var(--cyan3);color:var(--cyan)}
.tag-ok{background:var(--bg3);border:1px solid var(--ln);color:var(--t3)}
.tag-done{background:var(--cyan4);border:1px solid var(--cyan3);color:var(--cyan)}
.tag-pend{background:var(--bg3);border:1px solid var(--ln);color:var(--t4)}
.tag-cl{background:var(--grn3);border:1px solid var(--grn2);color:var(--grn)}
.tag-rp{background:var(--ylw3);border:1px solid var(--ylw2);color:var(--ylw)}
.tag-new{background:linear-gradient(135deg,rgba(0,216,240,.18),rgba(240,192,48,.18));
  border:1px solid var(--cyan2);color:var(--cyan);font-weight:700;
  animation:newGlow 2.4s ease-in-out infinite}
@keyframes newGlow{0%,100%{box-shadow:0 0 0 rgba(0,216,240,0)}50%{box-shadow:0 0 10px rgba(0,216,240,.45)}}
.gc.is-new{border-color:var(--cyan2);box-shadow:0 0 0 1px rgba(0,216,240,.15),0 8px 24px rgba(0,216,240,.08)}

/* ── FAVORITOS ──────────────────────────────────────────────────────────── */
.fav{cursor:pointer;color:var(--t4);font-size:15px;transition:.15s;user-select:none;
  display:inline-block;line-height:1;padding:2px}
.fav:hover{color:var(--gold);transform:scale(1.25)}
.fav.on{color:var(--gold);text-shadow:0 0 8px rgba(240,192,48,.5)}

/* ── FILTER BAR ─────────────────────────────────────────────────────────── */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fi{background:var(--bg2);border:1px solid var(--ln);border-radius:7px;
  padding:6px 10px;color:var(--t1);font-family:var(--fs);font-size:13px;
  outline:none;transition:.15s}
.fi:focus{border-color:var(--cyan2)}
.fi::placeholder{color:var(--t3)}
.fi.sel{cursor:pointer}
.fi.sel option{background:var(--bg0)}
.fi.w220{width:220px}.fi.w140{width:140px}.fi.w100{width:100px}
label.fi-chk{display:flex;align-items:center;gap:6px;cursor:pointer;
  font-size:13px;color:var(--t2);background:none;border:none;padding:6px 0}
label.fi-chk input{accent-color:var(--cyan)}

/* ── BUTTONS ────────────────────────────────────────────────────────────── */
.btn{padding:7px 14px;border-radius:7px;font-family:var(--fs);font-size:13px;
  font-weight:600;cursor:pointer;transition:.15s;border:1px solid;
  display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-cy{background:rgba(0,216,240,.1);border-color:var(--cyan3);color:var(--cyan)}
.btn-cy:hover:not(:disabled){background:rgba(0,216,240,.2);border-color:var(--cyan2)}
.btn-gh{background:transparent;border-color:var(--ln);color:var(--t2)}
.btn-gh:hover:not(:disabled){background:var(--bg3);border-color:var(--ln2);color:var(--t1)}
.btn-gn{background:var(--grn3);border-color:var(--grn2);color:var(--grn)}
.btn-gn:hover:not(:disabled){background:rgba(0,152,72,.3)}
.btn-sm{padding:5px 10px;font-size:12px}

/* ── PAGINATION ─────────────────────────────────────────────────────────── */
.pgn{display:flex;align-items:center;gap:5px;padding:10px 14px;border-top:1px solid var(--ln);flex-wrap:wrap}
.pbn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:5px;border:1px solid var(--ln);background:var(--bg3);
  color:var(--t2);cursor:pointer;font-size:12px;font-family:var(--fm);transition:.15s}
.pbn:hover{border-color:var(--ln2);color:var(--t1)}
.pbn.on{background:var(--cyan4);border-color:var(--cyan2);color:var(--cyan)}
.pgn-info{font-family:var(--fm);font-size:10px;color:var(--t3);padding:0 8px;margin-left:4px}

/* ── PHASE FLOW ─────────────────────────────────────────────────────────── */
.phases{display:flex;align-items:stretch;overflow-x:auto;padding-bottom:6px}
.ph-box{background:var(--bg2);border:1px solid var(--ln);border-radius:10px;
  padding:14px 18px;min-width:160px;flex-shrink:0;transition:.2s}
.ph-box.active{border-color:var(--cyan2);background:var(--bg3);
  box-shadow:0 0 20px rgba(0,216,240,.07)}
.ph-num{font-family:var(--fm);font-size:10px;color:var(--t3);letter-spacing:1px;margin-bottom:5px}
.ph-name{font-size:16px;font-weight:700;color:var(--t1);margin-bottom:4px}
.ph-detail{font-size:11px;color:var(--t3);line-height:1.5}
.ph-st{display:inline-block;padding:2px 8px;border-radius:4px;font-family:var(--fm);
  font-size:10px;margin-top:8px}
.ph-st.active{background:rgba(0,216,240,.1);color:var(--cyan);border:1px solid var(--cyan3)}
.ph-st.pend{background:var(--bg3);color:var(--t3);border:1px solid var(--ln)}
.ph-st.done{background:var(--grn3);color:var(--grn);border:1px solid var(--grn2)}
.ph-arr{display:flex;align-items:center;padding:0 8px;color:var(--t4);font-size:20px;
  flex-shrink:0;align-self:center;margin-top:10px}
.ph-progress{height:3px;background:var(--bg4);border-radius:2px;overflow:hidden;margin-top:8px}
.ph-progress-fill{height:100%;border-radius:2px;background:var(--cyan)}

/* ── GRUPO CARDS ────────────────────────────────────────────────────────── */
.grids{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.grids .gc{animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) backwards}
.grids .gc:nth-child(1){animation-delay:.01s}.grids .gc:nth-child(2){animation-delay:.03s}
.grids .gc:nth-child(3){animation-delay:.05s}.grids .gc:nth-child(4){animation-delay:.07s}
.grids .gc:nth-child(5){animation-delay:.09s}.grids .gc:nth-child(6){animation-delay:.11s}
.grids .gc:nth-child(7){animation-delay:.13s}.grids .gc:nth-child(8){animation-delay:.15s}
.grids .gc:nth-child(9){animation-delay:.17s}.grids .gc:nth-child(10){animation-delay:.19s}
.gc{background:var(--bg2);border:1px solid var(--ln);border-radius:10px;
  overflow:hidden;cursor:pointer;transition:.2s}
.gc:hover{border-color:var(--ln2);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.gc-head{padding:10px 14px;background:var(--bg3);border-bottom:1px solid var(--ln);
  display:flex;align-items:center;justify-content:space-between}
.gc-title{font-size:18px;font-weight:800;color:var(--cyan)}
.gc-body{padding:10px 13px}
.gc-row{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px}
.gc-pos{width:16px;text-align:right;font-family:var(--fm);font-size:10px;color:var(--t3);flex-shrink:0}
.gc-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc-pts{font-family:var(--fm);font-size:11px;color:var(--cyan);flex-shrink:0}
.gc-foot{padding:7px 13px 10px;display:flex;justify-content:space-between;
  font-family:var(--fm);font-size:11px;color:var(--t3)}

/* ── BAR CHART ──────────────────────────────────────────────────────────── */
.bar-list{display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:9px}
.bar-lbl{width:160px;font-size:12px;color:var(--t2);text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.bar-track{flex:1;height:22px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;
  padding-right:7px;justify-content:flex-end;transition:width .5s ease}
.bar-val{font-family:var(--fm);font-size:11px;font-weight:700;color:rgba(0,0,0,.7)}

/* ── PROFILE ────────────────────────────────────────────────────────────── */
.prof-ava{width:70px;height:70px;flex-shrink:0;background:var(--bg4);
  border:2px solid var(--ln2);border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:26px;font-weight:800;color:var(--cyan)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.stat-box{background:var(--bg3);border:1px solid var(--ln);border-radius:8px;padding:12px;text-align:center}
.stat-val{font-size:28px;font-weight:800;color:var(--cyan);line-height:1}
.stat-lbl{font-family:var(--fm);font-size:10px;color:var(--t3);text-transform:uppercase;
  letter-spacing:.5px;margin-top:3px}
.note-ta{width:100%;min-height:90px;background:var(--bg3);border:1px solid var(--ln);
  border-radius:7px;padding:10px 12px;color:var(--t1);font-family:var(--fs);
  font-size:13px;resize:vertical;outline:none;transition:.15s;line-height:1.6}
.note-ta:focus{border-color:var(--cyan2)}
.note-ta::placeholder{color:var(--t3)}

/* ── COMPARE ────────────────────────────────────────────────────────────── */
.cmp-grid{display:grid;grid-template-columns:1fr 50px 1fr;gap:12px}
.cmp-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:8px 15px;border-bottom:1px solid var(--ln)}
.cmp-row:last-child{border:none}
.cmp-v{font-family:var(--fm);font-size:13px}
.cmp-lbl{font-family:var(--fm);font-size:10px;color:var(--t3);text-align:center;
  text-transform:uppercase;letter-spacing:.5px;padding:0 8px}
.cmp-win{color:var(--grn)!important;font-weight:700}
.cmp-lose{color:var(--t4)!important}

/* ── GRID HELPERS ───────────────────────────────────────────────────────── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.gap14{gap:14px}

/* ── TOAST ──────────────────────────────────────────────────────────────── */
#toast{position:fixed;bottom:20px;right:20px;z-index:9999;display:none;
  background:var(--bg2);border:1px solid var(--grn2);border-radius:8px;
  padding:11px 18px;color:var(--grn);font-family:var(--fm);font-size:13px;
  box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:88vw}
#toast.warn{border-color:var(--red2);color:var(--red)}
#toast.gold{border-color:var(--gold2);color:var(--gold)}

/* ── DROPZONE ───────────────────────────────────────────────────────────── */
.dropzone{border:2px dashed var(--ln2);border-radius:10px;padding:26px 16px;
  text-align:center;color:var(--t3);font-size:13px;transition:.15s;margin-top:14px}
.dropzone.over{border-color:var(--cyan2);background:rgba(0,216,240,.05);color:var(--cyan)}

/* ── MISC ───────────────────────────────────────────────────────────────── */
.mono{font-family:var(--fm);font-size:12px}
.mono-sm{font-family:var(--fm);font-size:11px}
.empty{text-align:center;padding:48px;color:var(--t3)}
.empty-ico{font-size:44px;margin-bottom:12px}
.divider{height:1px;background:var(--ln);margin:16px 0}
.prov{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;
  border-radius:4px;font-family:var(--fm);font-size:10px;
  background:var(--ylw3);border:1px solid var(--ylw2);color:var(--ylw)}
.section-head{margin-bottom:4px}
.kbd{display:inline-block;padding:1px 6px;border-radius:4px;border:1px solid var(--ln2);
  background:var(--bg3);font-family:var(--fm);font-size:10px;color:var(--t2)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

/* ── RESPONSIVE ─────────────────────────────────────────────────────────── */
@media (max-width:1100px){
  .g3{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  #menu-btn{display:flex}
  #sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-105%);
    transition:transform .25s ease;box-shadow:none}
  #sidebar.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.55)}
  .g2,.g3{grid-template-columns:1fr}
  .cmp-grid{grid-template-columns:1fr}
  .cmp-vs-col{display:none}
  .gs-input{width:150px}
  .page{padding:16px 14px}
  .kpi-num{font-size:28px}
  .bar-lbl{width:104px}
  .tb-pill{display:none}
  .tb-title{font-size:15px}
}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// STORE — single source of truth, persisted to localStorage
// ═══════════════════════════════════════════════════════════════════════════
const LS_KEY = 'cmma2026_v6';

const Store = {
  _data: null,
  _seed: null,

  init(seed) {
    this._seed = seed;
    try {
      const saved = localStorage.getItem(LS_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed.meta && parsed.motores && parsed.grupos) {
          this._data = parsed;
        } else {
          this._data = seed;
        }
      } else {
        this._data = seed;
      }
    } catch(e) { this._data = seed; }
    this.save();
  },

  get data() { return this._data; },

  save() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(this._data));
      const el = document.getElementById('sb-saved');
      if (el) el.textContent = '✓ Guardado ' + new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
    } catch(e) {}
  },

  reset() {
    this._data = this._seed;
    localStorage.removeItem(LS_KEY);
    this.save();
  },

  importData(newData) {
    this._data = newData;
    this.save();
  },

  exportJSON() {
    downloadBlob(JSON.stringify(this._data, null, 2), 'application/json',
      'cmma2026_backup_' + new Date().toISOString().slice(0,10) + '.json');
  },

  updateMotorStat(nombre, field, value) {
    const m = this._data.motores.find(x => x.nombre === nombre);
    if (m) { m[field] = value; this.recalc(); this.save(); }
  },

  recalc() {
    const d = this._data;
    d.motores.forEach(m => {
      if (m.partidas > 0) m.pct = Math.round(m.puntos / m.partidas * 10000) / 100;
    });
    d.meta.clasificados = d.motores.filter(m=>m.estado==='clasificado').length;
    d.meta.repesca = d.motores.filter(m=>m.estado==='repesca').length;
    d.meta.en_juego = d.motores.filter(m=>m.estado==='en_juego').length;
    Object.values(d.grupos).forEach(g => {
      g.motores.forEach(gm => {
        const m = d.motores.find(x => x.nombre === gm.nombre);
        if (m) {
          gm.puntos = m.puntos; gm.victorias = m.victorias;
          gm.empates = m.empates; gm.derrotas = m.derrotas;
          gm.partidas = m.partidas; gm.pct = m.pct;
          gm.elo_actual = m.elo_actual; gm.elo_diff = m.elo_diff;
          gm.estado = m.estado;
        }
      });
      g.motores.sort((a,b) => b.puntos-a.puntos || b.victorias-a.victorias || b.elo_base-a.elo_base);
      g.motores.forEach((t,i) => t.pos_grupo = i+1);
    });
    d.ranking_global = [...d.motores.filter(m=>m.puesto_global)]
      .sort((a,b) => (a.puesto_global||9999)-(b.puesto_global||9999));
  },
};

// ═══════════════════════════════════════════════════════════════════════════
// FAVORITOS & NOTAS (persistidos aparte del dataset)
// ═══════════════════════════════════════════════════════════════════════════
const Favs = {
  KEY: 'cmma2026_favs',
  _s: new Set(),
  init() { try { this._s = new Set(JSON.parse(localStorage.getItem(this.KEY) || '[]')); } catch(e) {} },
  has(n) { return this._s.has(n); },
  list() { return [...this._s]; },
  toggle(n) {
    if (this._s.has(n)) this._s.delete(n); else this._s.add(n);
    try { localStorage.setItem(this.KEY, JSON.stringify([...this._s])); } catch(e) {}
    toast(this._s.has(n) ? '★ ' + n + ' añadido a favoritos' : '☆ ' + n + ' quitado de favoritos', 'gold');
  },
};

const Notes = {
  KEY: 'cmma2026_notes',
  _m: {},
  init() { try { this._m = JSON.parse(localStorage.getItem(this.KEY) || '{}'); } catch(e) {} },
  get(n) { return this._m[n] || ''; },
  set(n, t) {
    if (t && t.trim()) this._m[n] = t; else delete this._m[n];
    try { localStorage.setItem(this.KEY, JSON.stringify(this._m)); } catch(e) {}
  },
};

// ═══════════════════════════════════════════════════════════════════════════
// ROUTER — con hash: enlaces compartibles y botón atrás del navegador
// ═══════════════════════════════════════════════════════════════════════════
const Router = {
  _view: 'dashboard',
  _params: {},

  encode(v, p={}) {
    if (v === 'motor') return '#/motor/' + encodeURIComponent(p.nombre || '');
    if (v === 'grupo') return '#/grupo/' + (p.id ?? '');
    return '#/' + v;
  },

  decode() {
    const h = location.hash.replace(/^#\/?/, '');
    if (!h) return { view: 'dashboard', params: {} };
    const seg = h.split('/');
    if (seg[0] === 'motor' && seg.length > 1) {
      let nombre = seg.slice(1).join('/');
      try { nombre = decodeURIComponent(nombre); } catch(e) {}
      return { view: 'motor', params: { nombre } };
    }
    if (seg[0] === 'grupo' && seg[1]) return { view: 'grupo', params: { id: parseInt(seg[1]) } };
    return { view: seg[0], params: {} };
  },

  sync() {
    const d = this.decode();
    this._view = d.view;
    this._params = d.params;
  },

  go(view, params={}) {
    const h = this.encode(view, params);
    if (location.hash === h) { this.sync(); render(); }
    else location.hash = h;
  },

  back() {
    if (history.length > 1) history.back();
    else this.go('dashboard');
  },

  get view() { return this._view; },
  get params() { return this._params; },
};

window.addEventListener('hashchange', () => { Router.sync(); render(); });

// ═══════════════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════════════
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fPts = v => {
  if (v === null || v === undefined) return '—';
  const n = Number(v);
  if (isNaN(n)) return '—';
  return n % 1 === 0 ? n + '.0' : n.toFixed(1);
};
const fPct = v => v ? Number(v).toFixed(1) + '%' : '—';
const fElo = v => v ? v.toLocaleString() : '—';

function downloadBlob(content, type, filename) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function eloDiff(d) {
  if (!d && d !== 0) return '<span class="ez">—</span>';
  if (d > 0) return `<span class="ep">+${d}</span>`;
  if (d < 0) return `<span class="en">${d}</span>`;
  return '<span class="ez">0</span>';
}

// Puntuación esperada según la fórmula Elo
const eloExpect = (r1, r2) => 1 / (1 + Math.pow(10, (r2 - r1) / 400));

function statusBadge(estado) {
  if (estado==='clasificado') return '<span class="sb-badge sb-cl"><span class="sb-dot"></span>Clasif.</span>';
  if (estado==='repesca')     return '<span class="sb-badge sb-rp"><span class="sb-dot"></span>Repesca</span>';
  return '<span class="sb-badge sb-ej"><span class="sb-dot"></span>En Juego</span>';
}

function rankBadge(pos) {
  const c = pos===1?'rb1':pos===2?'rb2':pos===3?'rb3':pos===7?'rb7':'rbn';
  return `<span class="rb ${c}">${pos}</span>`;
}

function favBtn(nombre) {
  const on = Favs.has(nombre);
  return `<span class="fav${on?' on':''}" data-fav="${esc(nombre)}" role="button"
    title="${on?'Quitar de favoritos':'Añadir a favoritos'}">${on?'★':'☆'}</span>`;
}

function motorNameCell(nombre, tipo, withFav=true) {
  return `<span style="display:flex;align-items:center;gap:7px">
    ${withFav ? favBtn(nombre) : ''}
    <strong>${esc(nombre)}</strong>
    ${tipo==='nuevo'?'<span class="tag tag-n">NUEVO</span>':''}
  </span>`;
}

function eloActualCell(m) {
  const c = m.elo_actual>m.elo_base?'var(--grn)':m.elo_actual<m.elo_base?'var(--red)':'var(--t2)';
  return `<span class="mono" style="color:${c}">${m.elo_actual||m.elo_base}</span>`;
}

function sortTh(label, col, curCol, curDir) {
  const active = curCol === col;
  const icon = active ? (curDir==='asc'?'↑':'↓') : '<span style="color:var(--t4)">⇅</span>';
  return `<th class="sort" data-col="${col}">${label} ${icon}</th>`;
}

function pagination(total, perPage, page, onChangeFn) {
  const pages = Math.ceil(total / perPage);
  if (pages <= 1) return '';
  let btns = '';
  const shown = [];
  if (pages <= 7) {
    for (let i=1;i<=pages;i++) shown.push(i);
  } else {
    if (page <= 4) shown.push(1,2,3,4,5,'…',pages);
    else if (page >= pages-3) shown.push(1,'…',pages-4,pages-3,pages-2,pages-1,pages);
    else shown.push(1,'…',page-1,page,page+1,'…',pages);
  }
  shown.forEach(p => {
    if (p==='…') btns += `<span class="pbn" style="cursor:default;opacity:.4">…</span>`;
    else btns += `<span class="pbn${p===page?' on':''}" data-pg="${p}" onclick="(${onChangeFn})(${p})">${p}</span>`;
  });
  return `<div class="pgn">
    <span class="pbn" onclick="(${onChangeFn})(${Math.max(1,page-1)})">‹</span>
    ${btns}
    <span class="pbn" onclick="(${onChangeFn})(${Math.min(pages,page+1)})">›</span>
    <span class="pgn-info">${total.toLocaleString()} resultados · Pág ${page}/${pages}</span>
  </div>`;
}

function barChart(items, color, maxVal) {
  const max = maxVal || Math.max(...items.map(i=>i.val), 1);
  return `<div class="bar-list">` + items.map(item => `
    <div class="bar-row">
      <div class="bar-lbl" title="${esc(item.lbl)}">${esc(item.lbl)}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${Math.max(4,item.val/max*100)}%;background:${color}">
          <span class="bar-val">${item.display||item.val}</span>
        </div>
      </div>
    </div>`).join('') + `</div>`;
}

// Donut SVG autocontenido (sin librerías)
function donutChart(items, size=150, stroke=22, centerLbl='MOTORES') {
  const total = items.reduce((s,i)=>s+i.val, 0);
  if (!total) return '<div class="empty" style="padding:20px"><div class="empty-ico">📊</div>Sin datos</div>';
  const r = (size - stroke) / 2, C = 2 * Math.PI * r;
  let off = 0;
  const segs = items.filter(i=>i.val>0).map(i => {
    const len = i.val / total * C;
    const s = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${i.color}"
      stroke-width="${stroke}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}"
      stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})">
      <title>${esc(i.lbl)}: ${i.val}</title></circle>`;
    off += len;
    return s;
  }).join('');
  return `<div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img">${segs}
      <text x="50%" y="48%" text-anchor="middle" style="fill:#deeef8;font-size:26px;font-weight:800;font-family:Inter,system-ui,sans-serif">${total.toLocaleString()}</text>

// Scatter SVG: ELO base (x) vs variación (y) — cada punto un motor
function scatterChart(pts) {
  if (!pts.length) return '<div class="empty" style="padding:20px"><div class="empty-ico">📊</div>Sin datos</div>';
  const W=680, H=320, P={l:52,r:16,t:16,b:36};
  let x0=Math.min(...pts.map(p=>p.x)), x1=Math.max(...pts.map(p=>p.x));
  let y0=Math.min(...pts.map(p=>p.y),0), y1=Math.max(...pts.map(p=>p.y),0);
  const xr=(x1-x0)||1, yr=(y1-y0)||1;
  x0-=xr*.04; x1+=xr*.04; y0-=yr*.07; y1+=yr*.07;
  const X=v=>(P.l+(v-x0)/(x1-x0)*(W-P.l-P.r));
  const Y=v=>(H-P.b-(v-y0)/(y1-y0)*(H-P.t-P.b));
  const axis='#385878', grid='#142035';
  let g='';
  const NX=5, NY=5;
  for (let i=0;i<=NX;i++){
    const v=x0+i*(x1-x0)/NX, x=X(v).toFixed(1);
    g+=`<line x1="${x}" y1="${P.t}" x2="${x}" y2="${H-P.b}" stroke="${grid}" stroke-width="1"/>
        <text x="${x}" y="${H-P.b+16}" text-anchor="middle" style="fill:${axis};font-size:10px;font-family:monospace">${Math.round(v)}</text>`;
  }
  for (let i=0;i<=NY;i++){
    const v=y0+i*(y1-y0)/NY, y=Y(v).toFixed(1);
    g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="${grid}" stroke-width="1"/>
        <text x="${P.l-7}" y="${y}" text-anchor="end" dominant-baseline="middle" style="fill:${axis};font-size:10px;font-family:monospace">${Math.round(v)}</text>`;
  }
  const zero = (y0<0 && y1>0)
    ? `<line x1="${P.l}" y1="${Y(0).toFixed(1)}" x2="${W-P.r}" y2="${Y(0).toFixed(1)}" stroke="#7098b8" stroke-width="1" stroke-dasharray="5 4" opacity=".55"/>`
    : '';
  const dots = pts.map(p =>
    `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.4" fill="${p.color}" fill-opacity=".78"
      stroke="rgba(0,0,0,.4)" stroke-width=".5"><title>${esc(p.lbl)}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img">
    ${g}${zero}${dots}
    <text x="${(P.l+W-P.r)/2}" y="${H-4}" text-anchor="middle" style="fill:${axis};font-size:10px;font-family:monospace;letter-spacing:1px">ELO BASE</text>
    <text x="14" y="${(P.t+H-P.b)/2}" text-anchor="middle" transform="rotate(-90 14 ${(P.t+H-P.b)/2})" style="fill:${axis};font-size:10px;font-family:monospace;letter-spacing:1px">Δ ELO</text>
  </svg>`;
}

function toast(msg, type) {
  const el = document.getElementById('toast');
  if (!type) type = msg.startsWith('⚠') ? 'warn' : 'ok';
  el.className = type === 'ok' ? '' : type;
  document.getElementById('toast-msg').textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.display='none', 2800);
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}
function toggleSidebar() {
  const open = document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show', open);
}

// ── Ranking Global ────────────────────────────────────────────────────────
let RK = { q:'', grupo:'', estado:'', tipo:'', eloMin:'', conDatos:false, favs:false,
           sc:'puesto_global', sd:'asc', page:1 };

function rankingList() {
  const d = Store.data;
  let list = d.motores.filter(m => m.nombre && m.elo_base > 0);
  if (RK.q) list = list.filter(m => m.nombre.toLowerCase().includes(RK.q.toLowerCase()));
  if (RK.grupo) list = list.filter(m => String(m.grupo) === String(RK.grupo));
  if (RK.estado) list = list.filter(m => m.estado === RK.estado);
  if (RK.tipo) list = list.filter(m => m.tipo === RK.tipo);
  if (RK.eloMin) list = list.filter(m => m.elo_base >= parseInt(RK.eloMin));
  if (RK.conDatos) list = list.filter(m => m.partidas > 0);
  if (RK.favs) list = list.filter(m => Favs.has(m.nombre));
  list.sort((a,b) => {
    let va = a[RK.sc] ?? (RK.sc==='puesto_global'?99999:0);
    let vb = b[RK.sc] ?? (RK.sc==='puesto_global'?99999:0);
    if (RK.sc==='puesto_global') { va=va||99999; vb=vb||99999; }
    if (typeof va==='string') { va=va.toLowerCase(); vb=vb.toLowerCase(); }
    return va<vb?(RK.sd==='asc'?-1:1):va>vb?(RK.sd==='asc'?1:-1):0;
  });
  return list;
}

function exportRankingCSV() {
  const list = rankingList();
  if (!list.length) { toast('⚠ No hay motores que exportar'); return; }
  const head = ['pos','nombre','grupo','elo_base','elo_actual','delta_elo','partidas','puntos','victorias','empates','derrotas','pct','estado','tipo'];
  const lines = [head.join(';')].concat(list.map((m,i) => [
    m.puesto_global || i+1,
    '"' + m.nombre.replace(/"/g,'""') + '"',
    m.grupo || '', m.elo_base, m.elo_actual || m.elo_base, m.elo_diff,
    m.partidas, String(m.puntos).replace('.',','),
    m.victorias, m.empates, m.derrotas,
    String(m.pct).replace('.',','), m.estado, m.tipo,
  ].join(';')));
  downloadBlob('﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8',
    'cmma2026_ranking_' + new Date().toISOString().slice(0,10) + '.csv');
  toast('✓ CSV exportado (' + list.length + ' motores)');
}

function setupRankingSort() {
  document.querySelectorAll('#rk-table th.sort').forEach(th => {
    th.addEventListener('click', () => {

      if (RK.sc === col) RK.sd = RK.sd==='asc'?'desc':'asc';
      else { RK.sc = col; RK.sd = 'desc'; }
      RK.page = 1;
      renderContent();
    });
  });
}

// ── Analítica ELO ─────────────────────────────────────────────────────────
function viewAnalitica() {
  const d = Store.data;
  const withData = d.motores.filter(m=>m.partidas>0);
  const gains = [...withData].filter(m=>m.elo_diff>0).sort((a,b)=>b.elo_diff-a.elo_diff).slice(0,15);
  const losses = [...withData].filter(m=>m.elo_diff<0).sort((a,b)=>a.elo_diff-b.elo_diff).slice(0,15);
  const maxG = Math.max(...gains.map(m=>m.elo_diff),1);
  const maxL = Math.max(...losses.map(m=>Math.abs(m.elo_diff)),1);

  const eloBuckets = [[3600,Infinity,'3600+'],[3500,3600,'3500-99'],[3400,3500,'3400-99'],
    [3300,3400,'3300-99'],[3200,3300,'3200-99'],[3100,3200,'3100-99'],[3000,3100,'3000-99'],[0,3000,'<3000']];
  const dist = eloBuckets.map(([lo,hi,lbl])=>({
    lbl, val:d.motores.filter(m=>m.elo_base>=lo&&m.elo_base<hi).length}));
  const maxDist = Math.max(...dist.map(x=>x.val),1);

  const bestPerGroup = Object.values(d.grupos)
    .filter(g=>g.jugado)
    .map(g => {
      const top = g.motores.filter(m=>m.partidas>0).sort((a,b)=>b.puntos-a.puntos)[0];
      return top ? {grupo:g.nombre, motor:top.nombre, puntos:top.puntos, pct:top.pct} : null;
    }).filter(Boolean);

  const posC = withData.filter(m=>m.elo_diff>0).length;
  const negC = withData.filter(m=>m.elo_diff<0).length;
  const avgD = withData.length ? Math.round(withData.reduce((s,m)=>s+m.elo_diff,0)/withData.length) : 0;

  const scatterPts = withData.map(m=>({
    x:m.elo_base, y:m.elo_diff,
    lbl:`${m.nombre} · ELO ${m.elo_base} · Δ ${m.elo_diff>=0?'+':''}${m.elo_diff}`,
    color:m.elo_diff>0?'#00d870':m.elo_diff<0?'#ff4055':'#7098b8'}));

  return `<div class="page">
    <div class="pg-head">
      <div><div class="pg-title">Analítica de ELO</div>
      <div class="pg-sub">${withData.length} motores con datos · Análisis de variación de rating</div></div>
    </div>
    <div class="kpi-row">
      <div class="kpi v-grn"><div class="kpi-bar"></div><div class="kpi-lbl">Ganancias ELO</div><div class="kpi-num">${posC}</div><div class="kpi-sub">motores mejoraron</div></div>
      <div class="kpi v-red"><div class="kpi-bar"></div><div class="kpi-lbl">Pérdidas ELO</div><div class="kpi-num" style="color:var(--red)">${negC}</div><div class="kpi-sub">motores bajaron</div></div>
      <div class="kpi v-cyan"><div class="kpi-bar"></div><div class="kpi-lbl">Mayor Ganancia</div><div class="kpi-num">${gains[0]?'+'+gains[0].elo_diff:'—'}</div><div class="kpi-sub">${esc(gains[0]?.nombre||'')}</div></div>
      <div class="kpi v-gold"><div class="kpi-bar"></div><div class="kpi-lbl">Δ Promedio</div><div class="kpi-num" style="color:${avgD>=0?'var(--grn)':'var(--red)'}">${avgD>=0?'+':''}${avgD}</div></div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-head"><span class="card-title">📉 ELO Base vs Variación — cada punto es un motor</span>
        <span class="mono-sm" style="color:var(--t3)">pasa el cursor por un punto para ver el motor</span></div>
      <div class="card-body">${scatterChart(scatterPts)}</div>
    </div>

    <div class="g2 gap14" style="margin-bottom:16px">
      <div class="card">
        <div class="card-head"><span class="card-title" style="color:var(--grn)">🔺 Top 15 Ganancias de ELO</span></div>
        <div class="card-body">
          ${gains.length?barChart(gains.map(m=>({lbl:m.nombre,val:m.elo_diff,display:'+'+m.elo_diff})),
            'linear-gradient(90deg,#005830,var(--grn))',maxG):'<div class="empty" style="padding:20px"><div class="empty-ico">📊</div>Sin datos</div>'}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><span class="card-title" style="color:var(--red)">🔻 Top 15 Pérdidas de ELO</span></div>
        <div class="card-body">
          ${losses.length?barChart(losses.map(m=>({lbl:m.nombre,val:Math.abs(m.elo_diff),display:String(m.elo_diff)})),
            'linear-gradient(90deg,#480018,var(--red))',maxL):'<div class="empty" style="padding:20px"><div class="empty-ico">📊</div>Sin datos</div>'}
        </div>
      </div>
    </div>

    <div class="g2 gap14">
      <div class="card">
        <div class="card-head"><span class="card-title">📊 Distribución por Rango ELO</span></div>
        <div class="card-body">
          ${barChart(dist,'linear-gradient(90deg,var(--cyan3),var(--cyan))',maxDist)}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><span class="card-title">🏆 Mejor Resultado por Grupo</span></div>
        <div class="card-body">
          ${bestPerGroup.length?`<table class="tbl">
            <thead><tr><th>Grupo</th><th>Motor Líder</th><th>Pts</th><th>%</th></tr></thead>
            <tbody>${bestPerGroup.map(b=>`<tr data-goto-motor="${esc(b.motor)}" style="cursor:pointer">
              <td><span class="mono-sm" style="color:var(--cyan)">${esc(b.grupo)}</span></td>
              <td><strong>${esc(b.motor)}</strong></td>
              <td><span class="mono" style="color:var(--cyan);font-weight:700">${fPts(b.puntos)}</span></td>
              <td><span class="mono-sm">${fPct(b.pct)}</span></td>
            </tr>`).join('')}</tbody>
          </table>`:'<div class="empty" style="padding:20px"><div class="empty-ico">📊</div>Sin grupos finalizados</div>'}
        </div>
      </div>
    </div>
  </div>`;
}

function viewMotor(nombre) {
  const m = Store.data.motores.find(x => x.nombre === nombre);
  if (!m) return `<div class="page"><button class="btn btn-gh" onclick="Router.back()">← Volver</button><div class="empty"><div class="empty-ico">🔍</div>Motor no encontrado</div></div>`;

  const gData = m.grupo ? Store.data.grupos[String(m.grupo)] : null;
  const posG = gData?.motores?.findIndex(x=>x.nombre===nombre);
  const init = nombre.split(' ').map(w=>w[0]||'').join('').slice(0,3).toUpperCase();
  const ec = m.elo_actual>m.elo_base?'var(--grn)':m.elo_actual<m.elo_base?'var(--red)':'var(--t2)';
  const hasPts = m.partidas > 0;

  // Percentil por ELO base dentro del campo completo
  const allSorted = [...Store.data.motores].sort((a,b)=>b.elo_base-a.elo_base);
  const eloRank = allSorted.findIndex(x=>x.nombre===nombre)+1;
  const pctl = Math.max(1, Math.round(eloRank/allSorted.length*100));

  const statItems = [
    {lbl:'ELO Base',val:m.elo_base,c:'var(--t2)'},
    {lbl:'ELO Actual',val:m.elo_actual||m.elo_base,c:ec},
    {lbl:'Δ ELO',val:(m.elo_diff>=0?'+':'')+m.elo_diff,c:m.elo_diff>0?'var(--grn)':m.elo_diff<0?'var(--red)':'var(--t3)'},
    {lbl:'Percentil ELO',val:'Top '+pctl+'%',c:'var(--gold)'},
    {lbl:'Puntos',val:hasPts?fPts(m.puntos):'—',c:'var(--cyan)'},
    {lbl:'Victorias',val:hasPts?m.victorias:'—',c:'var(--grn)'},
    {lbl:'Empates',val:hasPts?m.empates:'—',c:'var(--t2)'},
    {lbl:'Derrotas',val:hasPts?m.derrotas:'—',c:'var(--red)'},
    {lbl:'Efectividad',val:hasPts?fPct(m.pct):'—',c:'var(--cyan)'},
  ];

  return `<div class="page">
    <button class="btn btn-gh" style="margin-bottom:18px" onclick="Router.back()">← Volver</button>
    <div style="display:flex;gap:18px;margin-bottom:20px;flex-wrap:wrap;align-items:flex-start">
      <div class="prof-ava">${esc(init)}</div>
      <div style="flex:1;min-width:200px">
        <div style="font-size:30px;font-weight:800;color:var(--t1);margin-bottom:6px;display:flex;align-items:center;gap:10px">
          ${esc(m.nombre)} <span style="font-size:22px">${favBtn(m.nombre)}</span>
        </div>
        <div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">
          ${m.grupo?`<span class="tag tag-ok" data-goto-grupo="${m.grupo}" style="cursor:pointer">Grupo ${m.grupo} →</span>`:''}
          ${posG>=0?`<span class="tag tag-ok">Pos. #${posG+1} en grupo</span>`:''}
          ${m.pos_ranking?`<span class="tag tag-ok">Ranking #${m.pos_ranking}</span>`:''}
          ${statusBadge(m.estado)}
          <span class="tag ${m.tipo==='nuevo'?'tag-n':'tag-ok'}">${esc(m.tipo)}</span>
        </div>
      </div>
      <button class="btn btn-cy" data-compare="${esc(m.nombre)}">⚔️ Comparar</button>
    </div>

    <div class="stat-grid" style="margin-bottom:20px">
      ${statItems.map(s=>`<div class="stat-box">
        <div class="stat-val" style="color:${s.c}">${s.val}</div>
        <div class="stat-lbl">${s.lbl}</div>
      </div>`).join('')}
    </div>

    ${hasPts?`<div class="g2 gap14" style="margin-bottom:18px">
      <div class="card">
        <div class="card-head"><span class="card-title">Distribución de Resultados</span></div>
        <div class="card-body">
          ${[{lbl:'Victorias',v:m.victorias,c:'var(--grn)'},
             {lbl:'Empates',v:m.empates,c:'var(--cyan)'},
             {lbl:'Derrotas',v:m.derrotas,c:'var(--red)'}].map(r=>`
            <div style="margin-bottom:12px">
              <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-bottom:4px">
                <span>${r.lbl}</span>
                <span style="font-family:var(--fm)">${r.v} (${Math.round(r.v/m.partidas*100)}%)</span>
              </div>
              <div style="height:9px;background:var(--bg3);border-radius:5px;overflow:hidden">
                <div style="height:100%;width:${r.v/m.partidas*100}%;background:${r.c};border-radius:5px"></div>
              </div>
            </div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><span class="card-title">Evolución ELO</span></div>
        <div class="card-body" style="display:flex;justify-content:space-around;align-items:center;padding:20px;flex-wrap:wrap;gap:10px">
          <div style="text-align:center">
            <div style="font-size:36px;font-weight:800;color:var(--t2)">${m.elo_base}</div>
            <div style="font-family:var(--fm);font-size:10px;color:var(--t3);margin-top:3px">BASE</div>
          </div>
          <div style="font-size:28px;font-weight:700;color:${m.elo_diff>0?'var(--grn)':m.elo_diff<0?'var(--red)':'var(--t3)'}">
            → ${m.elo_diff>=0?'+':''}${m.elo_diff}
          </div>
          <div style="text-align:center">
            <div style="font-size:36px;font-weight:800;color:${ec}">${m.elo_actual||m.elo_base}</div>
            <div style="font-family:var(--fm);font-size:10px;color:var(--t3);margin-top:3px">ACTUAL</div>
          </div>
        </div>
      </div>
    </div>`:''}

    ${gData?`<div class="card" style="margin-bottom:14px">
      <div class="card-head">
        <span class="card-title">Posición en ${esc(gData.nombre)}</span>
        <div style="display:flex;gap:8px;align-items:center">
          ${posG>=0?`<span class="tag tag-ok">Puesto #${posG+1}</span>`:''}
          <button class="btn btn-gh btn-sm" data-goto-grupo="${gData.id}">Ver grupo completo →</button>
        </div>
      </div>
      <div class="tbl-wrap" style="max-height:420px;overflow-y:auto"><table class="tbl">
        <thead><tr><th>#</th><th>Motor</th><th>ELO</th><th>Pts</th><th>%</th><th>Estado</th></tr></thead>
        <tbody>
          ${gData.motores.map((gm,i)=>`<tr class="${gm.nombre===nombre?'row-hl':''}" data-goto-motor="${esc(gm.nombre)}" style="cursor:pointer">
            <td>${rankBadge(i+1)}</td>
            <td><span style="font-weight:${gm.nombre===nombre?700:400};color:${gm.nombre===nombre?'var(--cyan)':'inherit'}">${esc(gm.nombre)}</span></td>
            <td><span class="mono">${gm.elo_base}</span></td>
            <td><span class="mono" style="color:var(--cyan)">${gm.partidas>0?fPts(gm.puntos):'—'}</span></td>
            <td><span class="mono-sm">${gm.pct>0?fPct(gm.pct):'—'}</span></td>
            <td>${statusBadge(gm.estado)}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`:''}

    <div class="card">
      <div class="card-head"><span class="card-title">📝 Notas personales</span>
        <span class="mono-sm" style="color:var(--t3)">se guardan automáticamente en este navegador</span></div>
      <div class="card-body">
        <textarea class="note-ta" data-note="${esc(m.nombre)}"
          placeholder="Apuntes sobre este motor: estilo de juego, versión, configuración, rivales difíciles...">${esc(Notes.get(m.nombre))}</textarea>
      </div>
    </div>
  </div>`;
}

// ── Comparador ────────────────────────────────────────────────────────────
let CMP = { m1:'', m2:'', q1:'', q2:'' };

function viewComparador() {
  const d = Store.data;
  const mo1 = d.motores.find(m=>m.nombre===CMP.m1);
  const mo2 = d.motores.find(m=>m.nombre===CMP.m2);
  const r1 = CMP.q1.length>=2 && !mo1 ? d.motores.filter(m=>m.nombre.toLowerCase().includes(CMP.q1.toLowerCase())).slice(0,8) : [];
  const r2 = CMP.q2.length>=2 && !mo2 ? d.motores.filter(m=>m.nombre.toLowerCase().includes(CMP.q2.toLowerCase())).slice(0,8) : [];

  const drop = (results, side) => results.length ? `<div class="gs-drop" style="display:block;position:relative;top:0;width:100%;margin-top:4px;max-height:200px;overflow-y:auto">
    ${results.map(m=>`<div class="gs-item" data-pick="${side}" data-name="${esc(m.nombre)}">
      <span>${esc(m.nombre)}</span>
      <span class="mono-sm" style="color:var(--t3)">ELO ${m.elo_base}</span>
    </div>`).join('')}
  </div>` : '';

  const statRows = [
    {lbl:'ELO Base',k:'elo_base',h:'max'},
    {lbl:'ELO Actual',k:'elo_actual',h:'max'},
    {lbl:'Δ ELO',k:'elo_diff',h:'max'},
    {lbl:'Puntos',k:'puntos',h:'max'},
    {lbl:'Victorias',k:'victorias',h:'max'},
    {lbl:'Empates',k:'empates',h:'max'},
    {lbl:'Derrotas',k:'derrotas',h:'min'},
    {lbl:'Partidas',k:'partidas',h:'max'},
    {lbl:'Efectividad %',k:'pct',h:'max'},
    {lbl:'Ranking Global',k:'puesto_global',h:'min'},
    {lbl:'Grupo',k:'grupo',h:'none'},
    {lbl:'Tipo',k:'tipo',h:'none'},
  ];

  const fmt = (m,k) => {
    if (!m) return '—';
    const v = m[k];
    if (v===null||v===undefined) return '—';
    if (k==='puntos') return fPts(v);
    if (k==='pct') return fPct(v);
    if (k==='elo_diff') return (v>=0?'+':'')+v;
    return esc(String(v));
  };

  const cmpRows = (mo1&&mo2) ? statRows.map(({lbl,k,h}) => {
    const v1=mo1[k]??null, v2=mo2[k]??null;
    const n1=typeof v1==='number'?v1:null, n2=typeof v2==='number'?v2:null;
    const w1=h==='max'?n1>n2:h==='min'?n1<n2:false;
    const w2=h==='max'?n2>n1:h==='min'?n2<n1:false;
    return `<div class="cmp-row">
      <div class="cmp-v" style="text-align:right;color:${w1?'var(--grn)':w2?'var(--t3)':'var(--t2)'}">${fmt(mo1,k)}</div>
      <div class="cmp-lbl">${lbl}</div>
      <div class="cmp-v" style="text-align:left;color:${w2?'var(--grn)':w1?'var(--t3)':'var(--t2)'}">${fmt(mo2,k)}</div>
    </div>`;
  }).join('') : '';

  // Pronóstico Elo: puntuación esperada con el ELO actual
  let forecast = '';
  if (mo1 && mo2) {
    const R1 = mo1.elo_actual || mo1.elo_base, R2 = mo2.elo_actual || mo2.elo_base;
    const e1 = eloExpect(R1, R2);
    const p1 = Math.round(e1*1000)/10, p2 = Math.round((1-e1)*1000)/10;
    forecast = `<div class="card" style="margin-top:14px">
      <div class="card-head"><span class="card-title">🔮 Pronóstico por ELO</span>
        <span class="mono-sm" style="color:var(--t3)">puntuación esperada según fórmula Elo (ELO actual: ${R1} vs ${R2})</span></div>
      <div class="card-body">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
          <span style="color:var(--cyan);font-weight:700">${esc(mo1.nombre)} · ${p1}%</span>
          <span style="color:var(--gold);font-weight:700">${p2}% · ${esc(mo2.nombre)}</span>
        </div>
        <div style="display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid var(--ln)">
          <div style="width:${p1}%;background:linear-gradient(90deg,var(--cyan3),var(--cyan2));min-width:2%"></div>
          <div style="flex:1;background:linear-gradient(90deg,var(--gold2),var(--gold3))"></div>
        </div>
        <div style="margin-top:10px;font-size:11px;color:var(--t3);line-height:1.6">
          La puntuación esperada E = 1 / (1 + 10<sup>(R₂−R₁)/400</sup>) estima los puntos por partida a largo plazo
          (una victoria vale 1, un empate 0.5). Entre motores de élite gran parte de ese valor se materializa en empates.
        </div>
      </div>
    </div>`;
  }

  return `<div class="page">
    <div class="pg-head"><div><div class="pg-title">Comparador de Motores</div>
    <div class="pg-sub">Compara estadísticas completas lado a lado</div></div></div>

    <div class="cmp-grid" style="margin-bottom:16px">
      <div>
        <input class="fi" style="width:100%;margin-bottom:6px" placeholder="🔍 Motor 1..."
          value="${esc(CMP.q1)}" oninput="CMP.q1=this.value;if(!this.value)CMP.m1='';else if(CMP.m1&&this.value!==CMP.m1)CMP.m1='';renderContent()">
        ${drop(r1,'1')}
      </div>
      <div class="cmp-vs-col" style="display:flex;align-items:center;justify-content:center">
        <div style="font-size:24px;font-weight:800;color:var(--t3);letter-spacing:3px">VS</div>
      </div>
      <div>
        <input class="fi" style="width:100%;margin-bottom:6px" placeholder="🔍 Motor 2..."
          value="${esc(CMP.q2)}" oninput="CMP.q2=this.value;if(!this.value)CMP.m2='';else if(CMP.m2&&this.value!==CMP.m2)CMP.m2='';renderContent()">
        ${drop(r2,'2')}
      </div>
    </div>

    ${mo1&&mo2?`<div class="card">
      <div style="display:grid;grid-template-columns:1fr 50px 1fr">
        <div style="padding:16px;background:var(--bg3);text-align:center;border-right:1px solid var(--ln)">
          <div style="font-size:20px;font-weight:700">${esc(mo1.nombre)}</div>
          <div class="mono-sm" style="color:var(--cyan);margin-top:3px">ELO ${mo1.elo_base}</div>
          <div style="margin-top:6px">${statusBadge(mo1.estado)}</div>
        </div>
        <div style="padding:16px;background:var(--bg3);display:flex;align-items:center;justify-content:center">
          <div style="font-size:18px;font-weight:800;color:var(--t3)">VS</div>
        </div>
        <div style="padding:16px;background:var(--bg3);text-align:center">
          <div style="font-size:20px;font-weight:700">${esc(mo2.nombre)}</div>
          <div class="mono-sm" style="color:var(--cyan);margin-top:3px">ELO ${mo2.elo_base}</div>
          <div style="margin-top:6px">${statusBadge(mo2.estado)}</div>
        </div>
      </div>
      ${cmpRows}
    </div>
    ${forecast}
    <div style="text-align:center;margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-cy" data-goto-motor="${esc(mo1.nombre)}">Ver ficha de ${esc(mo1.nombre)}</button>
      <button class="btn btn-cy" data-goto-motor="${esc(mo2.nombre)}">Ver ficha de ${esc(mo2.nombre)}</button>
    </div>`
    :`<div class="empty" style="margin-top:40px"><div class="empty-ico">⚔️</div><div>Busca y selecciona dos motores para comparar</div></div>`}
  </div>`;
}

// ── Repesca ───────────────────────────────────────────────────────────────
function viewRepesca() {
  const d = Store.data;
  const meta = d.meta;
  const rpMotors = d.motores.filter(m=>m.estado==='repesca')
    .sort((a,b)=>(a.puesto_global||999)-(b.puesto_global||999));

  return `<div class="page">
    <div class="pg-head">
      <div><div class="pg-title">Fase de Repesca</div>
      <div class="pg-sub">Séptimos lugares de cada grupo · Round robin doble vuelta · ${meta.max_repesca} clasifican a fase de élite</div></div>
    </div>
    <div class="kpi-row">
      <div class="kpi v-ylw"><div class="kpi-bar"></div><div class="kpi-lbl">En Repesca</div><div class="kpi-num">${rpMotors.length}</div><div class="kpi-sub">séptimos confirmados</div></div>
      <div class="kpi v-cyan"><div class="kpi-bar"></div><div class="kpi-lbl">Pendientes</div><div class="kpi-num">${Math.max(0,meta.grupos_total-rpMotors.length)}</div><div class="kpi-sub">grupos sin jugar</div></div>
      <div class="kpi v-grn"><div class="kpi-bar"></div><div class="kpi-lbl">Clasificarán</div><div class="kpi-num">${meta.max_repesca}</div><div class="kpi-sub">a fase de élite</div></div>
      <div class="kpi v-gold"><div class="kpi-bar"></div><div class="kpi-lbl">Formato</div><div class="kpi-num" style="font-size:18px;padding-top:4px">RR Doble</div><div class="kpi-sub">1 partida como blancas + 1 como negras</div></div>
    </div>

    ${rpMotors.length?`<div class="card">
      <div class="card-head"><span class="card-title" style="color:var(--ylw)">↑ Séptimos Lugares — Repesca Confirmada</span></div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>#</th><th>Motor</th><th>Grupo</th><th>ELO Base</th><th>ELO Act.</th><th>Δ ELO</th><th>Pts G.Prev.</th><th>%</th><th>V</th><th>T</th><th>D</th></tr></thead>
        <tbody>
          ${rpMotors.map(m=>`<tr class="row-rp" data-goto-motor="${esc(m.nombre)}" style="cursor:pointer">
            <td><span class="rb rb7">7</span></td>
            <td>${motorNameCell(m.nombre,m.tipo)}</td>
            <td><span class="mono-sm" style="color:var(--ylw)">${m.grupo?'G'+m.grupo:'—'}</span></td>
            <td><span class="mono">${m.elo_base}</span></td>
            <td>${eloActualCell(m)}</td>
            <td>${eloDiff(m.elo_diff)}</td>
            <td><span class="mono" style="color:var(--cyan)">${fPts(m.puntos)}</span></td>
            <td><span class="mono-sm">${fPct(m.pct)}</span></td>
            <td><span class="mono" style="color:var(--grn)">${m.victorias}</span></td>
            <td><span class="mono">${m.empates}</span></td>
            <td><span class="mono" style="color:var(--red)">${m.derrotas}</span></td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>
    <div class="card" style="margin-top:14px;border-color:var(--ylw2)">
      <div class="card-body">
        <div style="color:var(--ylw);font-family:var(--fm);font-size:12px;margin-bottom:8px">ℹ CRITERIOS DE DESEMPATE EN REPESCA</div>
        <div style="color:var(--t3);font-size:13px;line-height:1.8">
          1. Puntos totales · 2. Resultado particular entre implicados · 3. Sonneborn-Berger · 4. Número de victorias · 5. Victorias con negras · 6. Performance ELO · 7. Menor número de derrotas · 8. Decisión de la organización
        </div>
      </div>
    </div>`
    :`<div class="empty"><div class="empty-ico">⏳</div><div>Aún no hay séptimos confirmados. Los datos aparecerán conforme se jueguen los grupos.</div></div>`}
  </div>`;
}

        </div>
        <div class="card" style="padding:16px 24px;min-width:160px">
          <div style="font-size:30px;font-weight:800;color:var(--ylw)">${meta.repesca}</div>

// ── Reglamento ────────────────────────────────────────────────────────────
function viewReglamento() {
  const d = Store.data;
  const meta = d.meta;
  const totalElite = meta.max_clasificados + meta.max_repesca;
  const phases = [
    {n:'01',name:'Fase Clasificatoria',color:'var(--cyan)',
     items:[`${meta.grupos_total} grupos oficiales`,'29–30 motores por grupo','Formato: Liga todos contra todos','6 clasificados directos por grupo','7.º lugar de cada grupo a Repesca',`Total clasificados directos: ${meta.max_clasificados}`]},
    {n:'02',name:'Fase de Repesca',color:'var(--ylw)',
     items:[`${meta.grupos_total} séptimos lugares`,'Round robin a doble vuelta (1 blancas + 1 negras vs cada rival)',`${meta.max_repesca} motores clasifican a Fase de Élite`,'Objetivo: eliminar ventaja de grupo más difícil']},
    {n:'03',name:'Fase de Élite',color:'var(--gold)',
     items:[`${totalElite} motores (${meta.max_clasificados} directos + ${meta.max_repesca} repesca)`,'8 grupos de 18 motores','Formato: Liga todos contra todos','2 mejores de cada grupo a Superfinal','Total finalistas: 16']},
    {n:'FINAL',name:'Superfinal Mundial',color:'var(--grn)',

// ── Importación de archivos (input o drag & drop) ─────────────────────────
function importFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext === 'json') return readJSONFile(file);
  if (ext === 'xlsx' || ext === 'xls') return readXLSXFile(file);
  toast('⚠ Formato no soportado: .' + ext);
}

function readXLSXFile(file) {
  if (typeof XLSX === 'undefined') { toast('⚠ SheetJS no disponible (se requiere conexión a internet la primera vez)'); return; }
  const btn = document.getElementById('xlsx-btn');
  if (btn) btn.textContent = '⏳ Procesando...';
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const wb = XLSX.read(ev.target.result, {type:'array'});
      const nd = parseExcel(wb);
      if (nd) { Store.importData(nd); Router.go('dashboard'); toast('✓ Excel importado correctamente'); }
      else toast('⚠ No se pudo parsear el Excel');
    } catch(e) { toast('⚠ Error: ' + e.message); }
    if (btn) btn.textContent = '📊 Importar Excel (.xlsx)';
  };
  reader.readAsArrayBuffer(file);
}

function readJSONFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const nd = JSON.parse(ev.target.result);
      if (nd.motores && nd.grupos && nd.meta) {
        Store.importData(nd); Router.go('dashboard'); toast('✓ JSON importado correctamente');
      } else toast('⚠ JSON inválido: requiere motores, grupos y meta');
    } catch(e) { toast('⚠ Error JSON: ' + e.message); }
  };
  reader.readAsText(file);
}

function setupDropzone() {
  const dz = document.getElementById('dropzone');
  if (!dz) return;
  ['dragover','dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave','dragend'].forEach(ev => dz.addEventListener(ev, () => dz.classList.remove('over')));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('over');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) importFile(f);
  });
}

// ── Excel Parser ──────────────────────────────────────────────────────────
function parseExcel(wb) {
  const JUGADOS = new Set([3,4,5,12,14,15,18]);
  const si = (v,d=0) => { try{const n=parseInt(v);return isNaN(n)?d:n}catch{return d} };
  const sf = (v,d=0) => { try{const n=parseFloat(v);return isNaN(n)?d:n}catch{return d} };

  // Ranking
  const rk = XLSX.utils.sheet_to_json(wb.Sheets['Ranking']||{},{header:1,defval:null});
  const normales={}, nuevos={};
  for (let i=1;i<rk.length;i++) {
    const r=rk[i];
    if (r[0]&&r[1]&&String(r[1]).trim()!=='') {
      const n=String(r[1]).trim();
      normales[n]={elo_base:si(r[2]),pos_ranking:si(r[0],null)||null};
    }
    if (r[4]&&String(r[4]).trim()!==''&&String(r[4]).trim()!=='Motores nuevos') {
      nuevos[String(r[4]).trim()]={elo_base:si(parseFloat(r[5]||0))};
    }
  }

  // Clasificación
  const cl = XLSX.utils.sheet_to_json(wb.Sheets['Clasificación']||{},{header:1,defval:null});
  const clasif={};
  for (let i=1;i<cl.length;i++) {
    const r=cl[i];
    if (!r[1]||String(r[1]).trim()==='') continue;
    const n=String(r[1]).trim();
    const statusTxt=String(r[13]||'');
    let estado='en_juego';
    if (statusTxt.includes('Directo')) estado='clasificado';
    else if (statusTxt.includes('Repechaje')||statusTxt.includes('Repesca')) estado='repesca';
    clasif[n]={puesto_global:si(r[0],null)||null,elo_base_cl:si(r[2]),
      elo_actual:si(r[9],si(r[2])),elo_diff:si(r[10]),partidas:si(r[3]),
      puntos:sf(r[4]),pct:Math.round(sf(r[5])*100)/100,
      victorias:si(r[6]),empates:si(r[7]),derrotas:si(r[8]),estado};
  }

  // Grupos
  const gr = XLSX.utils.sheet_to_json(wb.Sheets['Grupos']||{},{header:1,defval:null});
  const grupos_raw={}, m2g={};
  for (let r=0;r<gr.length;r++) for (let c=0;c<gr[r].length;c++) {
    const v=gr[r][c]; if(!v) continue;
    const m=String(v).match(/Equipo\s*\[(\d+)\]/);
    if (m) {
      const gn=parseInt(m[1]), mems=[];
      for (let r2=r+1;r2<r+35&&r2<gr.length;r2++) {
        const nm=gr[r2][c],el=gr[r2][c+1];
        if(!nm||String(nm).match(/Equipo\s*\[/)) break;
        const name=String(nm).trim();
        mems.push({nombre:name,elo:si(parseFloat(el||0))});
        m2g[name]=gn;
      }
      if (mems.length) grupos_raw[gn]=mems;
    }
  }

  // Merge
  const bm=(n,elo,tipo,pos)=>{
    const c=clasif[n]||{};
    return {nombre:n,elo_base:elo,elo_actual:c.elo_actual||elo,elo_diff:c.elo_diff||0,
      tipo,pos_ranking:pos,grupo:m2g[n]||null,puesto_global:c.puesto_global||null,
      partidas:c.partidas||0,puntos:c.puntos||0,pct:c.pct||0,
      victorias:c.victorias||0,empates:c.empates||0,derrotas:c.derrotas||0,
      estado:c.estado||'en_juego'};
  };
  const motores={};
  Object.entries(normales).forEach(([n,d])=>motores[n]=bm(n,d.elo_base,'normal',d.pos_ranking));
  Object.entries(nuevos).forEach(([n,d])=>{ if(motores[n])motores[n].tipo='nuevo'; else motores[n]=bm(n,d.elo_base,'nuevo',null); });
  Object.entries(clasif).forEach(([n,c])=>{ if(!motores[n])motores[n]=bm(n,c.elo_base_cl,'normal',null); });

  const grupos={};
  Object.entries(grupos_raw).forEach(([gn,mems])=>{
    const tabla=mems.map(m=>{const md=motores[m.nombre]||{};
      return{...md,nombre:m.nombre,elo_base:m.elo,elo_actual:md.elo_actual||m.elo};});
    tabla.sort((a,b)=>b.puntos-a.puntos||b.victorias-a.victorias||b.elo_base-a.elo_base);
    tabla.forEach((t,i)=>t.pos_grupo=i+1);
    const avg=Math.round(tabla.reduce((s,t)=>s+t.elo_base,0)/tabla.length)||0;
    const jug=JUGADOS.has(parseInt(gn));
    grupos[gn]={id:parseInt(gn),nombre:`Grupo ${gn}`,motores:tabla,total:tabla.length,
      avg_elo:avg,jugado:jug,estado:jug?'finalizado':'pendiente'};
  });

  const lista=Object.values(motores);
  const prevMeta = (Store.data && Store.data.meta) || {};
  return {meta:{torneo:'Campeonato Mundial de Motores de Ajedrez 2026',
    total:lista.length,nuevos:lista.filter(m=>m.tipo==='nuevo').length,
    clasificados:lista.filter(m=>m.estado==='clasificado').length,
    repesca:lista.filter(m=>m.estado==='repesca').length,
    en_juego:lista.filter(m=>m.estado==='en_juego').length,
    grupos_total:Object.keys(grupos).length,grupos_jugados:JUGADOS.size,
    lista_jugados:[...JUGADOS].sort((a,b)=>a-b),max_clasificados:132,max_repesca:12,
    grupo_nuevo:prevMeta.grupo_nuevo??null},
    motores:lista,grupos,
    ranking_global:[...lista.filter(m=>m.puesto_global)].sort((a,b)=>(a.puesto_global||9999)-(b.puesto_global||9999))};
}

// ── Búsqueda global con navegación por teclado ─────────────────────────────
const GS = { res: [], idx: -1, q: '' };

function hiName(name, q) {
  const i = name.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(name);
  return esc(name.slice(0,i)) + '<mark>' + esc(name.slice(i, i+q.length)) + '</mark>' + esc(name.slice(i+q.length));
}

function initSearch() {
  const inp = document.getElementById('gs-input');
  const drop = document.getElementById('gs-drop');

  const renderDrop = () => {
    if (!GS.res.length) { drop.style.display='none'; return; }
    drop.innerHTML = GS.res.map((m,i)=>`<div class="gs-item${i===GS.idx?' active':''}" data-gs="${esc(m.nombre)}">
      <span class="gs-item-name">${hiName(m.nombre, GS.q)}</span>
      <div class="gs-item-meta">
        ${m.grupo?`<span class="mono-sm" style="color:var(--t3)">G${m.grupo}</span>`:''}
        <span class="mono-sm" style="color:var(--t3)">${m.elo_base}</span>
        ${statusBadge(m.estado)}
      </div>
    </div>`).join('') +
    `<div class="gs-hint">↑↓ navegar · Enter abrir · Esc cerrar</div>`;
    drop.style.display='block';
  };

  inp.addEventListener('input', () => {
    GS.q = inp.value;
    if (GS.q.length < 2) { GS.res=[]; renderDrop(); return; }
    const ql = GS.q.toLowerCase();
    GS.res = Store.data.motores.filter(m=>m.nombre.toLowerCase().includes(ql))
      .sort((a,b)=>a.nombre.toLowerCase().indexOf(ql)-b.nombre.toLowerCase().indexOf(ql) || b.elo_base-a.elo_base)
      .slice(0,8);
    GS.idx = GS.res.length ? 0 : -1;
    renderDrop();
  });

  inp.addEventListener('keydown', e => {
    if (e.key==='ArrowDown') { e.preventDefault(); if(GS.res.length){GS.idx=(GS.idx+1)%GS.res.length; renderDrop();} }
    else if (e.key==='ArrowUp') { e.preventDefault(); if(GS.res.length){GS.idx=(GS.idx-1+GS.res.length)%GS.res.length; renderDrop();} }
    else if (e.key==='Enter') { if(GS.idx>=0 && GS.res[GS.idx]) selectMotor(GS.res[GS.idx].nombre); }
    else if (e.key==='Escape') { GS.res=[]; renderDrop(); inp.blur(); }
  });

  inp.addEventListener('blur', () => setTimeout(()=>{ drop.style.display='none'; }, 200));
  drop.addEventListener('mousedown', e => {
    const it = e.target.closest('[data-gs]');
    if (it) selectMotor(it.dataset.gs);
  });
}

function selectMotor(nombre) {
  document.getElementById('gs-input').value = '';
  GS.res = []; GS.idx = -1;
  document.getElementById('gs-drop').style.display = 'none';
  Router.go('motor', {nombre});
}

    switch(v) {
      case 'dashboard':    html = viewDashboard(); break;
      case 'grupos':       html = viewGrupos(); break;
      case 'grupo':        html = viewGrupo(p.id); break;
      case 'clasificacion':html = viewClasificacion(); break;
      case 'repesca':      html = viewRepesca(); break;
      case 'ranking':      html = viewRanking(); break;
      case 'nuevos':       html = viewNuevos(); break;
      case 'comparador':   html = viewComparador(); break;
      case 'analitica':    html = viewAnalitica(); break;
      case 'elite':        html = viewElite(); break;
      case 'reglamento':   html = viewReglamento(); break;
      case 'datos':        html = viewDatos(); break;
      case 'motor':        html = viewMotor(p.nombre); break;
      default:             html = viewDashboard();
    }
  } catch(e) {
    html = `<div class="page"><div class="empty"><div class="empty-ico">⚠️</div><div>Error: ${esc(e.message)}</div></div></div>`;
    console.error(e);
  }
  document.getElementById('content').innerHTML = html;
  document.getElementById('tb-title').textContent = TITLES[v] || v;
  const provViews = ['dashboard','ranking','grupos','grupo','clasificacion','analitica'];
  document.getElementById('tb-prov').style.display = provViews.includes(v) ? 'inline-flex' : 'none';
  if (v === 'ranking') setupRankingSort();
  if (v === 'datos') setupDropzone();
  document.getElementById('content').scrollTop = 0;
  animateKpiNumbers();
}

// ── KPI count-up animation ─────────────────────────────────────────────────
function animateKpiNumbers() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.kpi-num').forEach(el => {
    const raw = el.textContent.trim();
    const m = raw.match(/^([+-]?)([\d.,]+)(.*)$/);
    if (!m) return;
    const sign = m[1], numStr = m[2].replace(/,/g,''), suffix = m[3];
    const target = parseFloat(numStr);
    if (isNaN(target) || target === 0) return;
    const hasComma = m[2].includes(',');
    const dur = 600, start = performance.now();
    el.style.opacity = '0.4';
    function tick(now) {
      const p = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      const cur = target * eased;
      const display = Number.isInteger(target) ? Math.round(cur) : cur.toFixed(1);
      el.textContent = sign + (hasComma ? Number(display).toLocaleString('en-US') : display) + suffix;
      el.style.opacity = (0.4 + 0.6 * p).toFixed(2);
      if (p < 1) requestAnimationFrame(tick);
      else { el.textContent = raw; el.style.opacity = '1'; }
    }
    requestAnimationFrame(tick);
  });
}

function render() {
  buildNav();
  renderContent();
}

// ═══════════════════════════════════════════════════════════════════════════
// EVENT DELEGATION (navegación, favoritos, notas, comparador)
// ═══════════════════════════════════════════════════════════════════════════
function initDelegation() {
  document.addEventListener('click', e => {
    const fav = e.target.closest('[data-fav]');
    if (fav) { e.stopPropagation(); Favs.toggle(fav.dataset.fav); renderContent(); return; }
    const cp = e.target.closest('[data-compare]');
    if (cp) { CMP.m1 = cp.dataset.compare; CMP.q1 = CMP.m1; CMP.m2=''; CMP.q2=''; Router.go('comparador'); return; }
    const gg = e.target.closest('[data-goto-grupo]');
    if (gg) { e.stopPropagation(); Router.go('grupo', {id: parseInt(gg.dataset.gotoGrupo)}); return; }
    const gm = e.target.closest('[data-goto-motor]');
    if (gm) { Router.go('motor', {nombre: gm.dataset.gotoMotor}); return; }
  });

  // Selección en dropdowns del comparador (mousedown para ganar al blur)
  document.getElementById('content').addEventListener('mousedown', e => {
    const it = e.target.closest('[data-pick]');
    if (!it) return;
    if (it.dataset.pick === '1') { CMP.m1 = it.dataset.name; CMP.q1 = it.dataset.name; }
    else { CMP.m2 = it.dataset.name; CMP.q2 = it.dataset.name; }
    renderContent();
  });

  // Notas: auto-guardado al escribir
  document.getElementById('content').addEventListener('input', e => {
    const ta = e.target.closest('[data-note]');
    if (ta) { Notes.set(ta.dataset.note, ta.value); Store.save(); }
  });

  // Sidebar móvil
  document.getElementById('menu-btn').addEventListener('click', toggleSidebar);
  document.getElementById('backdrop').addEventListener('click', closeSidebar);

  // Atajos de teclado globales
  document.addEventListener('keydown', e => {
    const tag = document.activeElement && document.activeElement.tagName;
    const typing = tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT';
    if (e.key === '/' && !typing) {
      e.preventDefault();
      document.getElementById('gs-input').focus();
    } else if (e.key === 'Escape') {
      closeSidebar();
    }
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  if (typeof DATA === 'undefined') {
    document.getElementById('content').innerHTML = '<div class="empty"><div class="empty-ico">⚠️</div><div>Error: datos no cargados</div></div>';
    return;
  }
  Store.init(DATA);
  Favs.init();
  Notes.init();
  initSearch();
  initDelegation();
  Router.sync();
  render();
});
</script>
